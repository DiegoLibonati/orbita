services:
  orbita-app:
    image: ghcr.io/diegolibonati/orbita:latest
    restart: always
    ports:
      - "${APP_PORT:-9002}:8080"
    networks:
      - orbita-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  orbita-net: